<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">

    <body>

        <ui:composition template="./../WEB-INF/templates/matriculas_templete.xhtml">

            <ui:define name="content">
                 <div class="caixa_retangular">
                    <div class="caixa_retangular_item">
                     N.º do aluno:
                    #{matriculaMBean.matricula.aluno.idAluno}
                    </div>
                    <div class="caixa_retangular_item">
                     Nome:
                    #{matriculaMBean.matricula.aluno.nomeAluno}
                    </div>
                    <div class="caixa_retangular_item">
                    Sobrenome:
                    #{matriculaMBean.matricula.aluno.sobrenomeAluno}
                    </div>
                     <div class="caixa_retangular_item">
                    Data de Nascimento:
                    #{matriculaMBean.matricula.aluno.dataNascimentoAluno}
                    </div>
                    
                 </div>
                <p:panel header="Serviços Seleccionados">

                    <p:dataTable var="item" value="#{cestoMatriculaDetalheMBean.cesto}" emptyMessage="Nenhum serviço seleccionado">
                        
                        
                        <p:column headerText="Serviço">
                            <h:outputText value="#{item.servico.descricaoServico}"/>
                        </p:column>

                        <p:column headerText="Preço">
                            <h:outputText value="#{item.precoServico}"/>
                        </p:column>

                        <p:column headerText="Sub Total">
                            <h:outputText value="#{item.precoServico * item.quantidadeServico}">
                                <f:convertNumber pattern="#,##0.00" currencySymbol="KZ"/>
                            </h:outputText>
                        </p:column>

                    </p:dataTable>

                    <f:facet name="footer">
                        <h2>Total a pagar:</h2>
                        <h:outputText value="#{cestoMatriculaDetalheMBean.totalAPagar()}" style="font-size: 1.3em; ">
                            <f:convertNumber type="currency"  pattern="#,##0.00"/>
                        </h:outputText>
                    </f:facet>
                </p:panel>
                <h:form>
                        <h:panelGrid columns="2">
                            <p:commandButton value="Cancelar Inscrição" action="#{cestoMatriculaDetalheMBean.cancelarPagamentoMatricula}" ajax="false"/>
                            <p:commandButton value="Confirmar e Concluir" action="matriculas_pagamento_concluir?faces-redirect=true" ajax="false"/>
                        </h:panelGrid>
                    </h:form>
            </ui:define>
            
        </ui:composition>

    </body>
</html>
