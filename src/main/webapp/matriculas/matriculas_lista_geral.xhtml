<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/matriculas_templete.xhtml">




            <ui:define name="content">
              
                <p:panel id="pnlListagem" header="Listagem geral das ultimas 50 inscrições (Recibos)">
                    <h:form id="frmInscricoes">
                        <p:dataTable id="tblInscricoes" value="#{matriculaMBean.matriculasEntreDatas}" var="item"   rows="20"
                                     paginator="true" paginatorPosition="bottom"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                     rowsPerPageTemplate="10,20,{ShowAll|'All'}" scrollable="true" scrollHeight="600">



                            <p:column headerText="N.º Recibo:">
                                <h:outputText value="Recibo N.º: #{item.idMatricula}"/>                        

                            </p:column>


                            <p:column headerText="Aluno">
                                <h:outputText value="#{item.aluno.nomeAluno} #{item.aluno.sobrenomeAluno}"/>    
                            </p:column>



                            <p:column headerText="Forma de pagamento">
                                <h:outputText value="#{item.formaPagamento.descricaoFormaPagamento}"/>                            
                            </p:column>
                            <p:column headerText="Data">
                                <h:outputText value="#{item.dataMatricula}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Operações" width="250px">
                                <h:panelGrid columns="2">
                                    <p:commandButton value="Imprimir" action="#{matriculaMBean.imprimirReciboMatricula(item.idMatricula)}" ajax="false"   icon="fa fa-fw fa-print"/>
                                <p:commandButton value="Download" action="#{matriculaMBean.downloadReciboMatricula(item.idMatricula)}" ajax="false" icon="fa fa-fw fa-download"/>
                                </h:panelGrid>
                            </p:column>

                            <p:summaryRow>
                                <p:column colspan="5" style="text-align:right">
                                    <h:outputText value=""/>
                                </p:column>
                                <p:column>
                                    <h:outputText value=""/>
                                </p:column>
                            </p:summaryRow>



                        </p:dataTable>

                    </h:form>
                </p:panel>

            </ui:define>


        </ui:composition>

    </body>
</html>
