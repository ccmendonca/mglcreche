<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <body>

        <ui:composition template="./../WEB-INF/templates/matriculas_templete.xhtml">

            <ui:define name="content">
                <div class="caixa_retangular">
                    <div class="caixa_retangular_item">
                     N.º do aluno:
                    #{matriculaMBean.matricula.aluno.idAluno}
                    </div>
                    <div class="caixa_retangular_item">
                     Nome:
                    #{matriculaMBean.matricula.aluno.nomeAluno}
                    </div>
                    <div class="caixa_retangular_item">
                    Sobrenome:
                    #{matriculaMBean.matricula.aluno.sobrenomeAluno}
                    </div>
                     <div class="caixa_retangular_item">
                    Data de Nascimento:
                    #{matriculaMBean.matricula.aluno.dataNascimentoAluno}
                    </div>
                    
                 </div>

                <h:form id="mesesseleccionados">
                    <h:messages showDetail="true"/>
                    <p:dataTable id="dtblservicos" var="item" value="#{servicoMBean.servicosMatriculas}" scrollable="true" scrollHeight="600" lazy="false">
                        

                        <p:column headerText="Serviço">
                            <h:outputText value="#{item.descricaoServico}"/>
                        </p:column>

                        <p:column headerText="Valor Matrícula">
                            <h:outputText value="#{item.precoServico}"/>
                        </p:column>
                        <p:column headerText="Seleccionar o Serviço">
                            <p:commandButton value="Selecionar" action="#{cestoMatriculaDetalheMBean.adicionarServicoCesto(item)}"/>
                        </p:column>
                    </p:dataTable>
                </h:form>


                <h:form>
                    <p:commandButton value="Ver serviços seleccionados" action="matricula_cesto_servicos_selecionados?faces-redirect=true" />

                </h:form>
            </ui:define>

        </ui:composition>

    </body>
</html>
